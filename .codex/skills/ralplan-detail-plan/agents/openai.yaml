display_name: Ralplan 细化方案
short_description: 将 ralplan 最终方案细化为带工程约束、测试用例和流程图规则的中文落地实施方案
default_prompt: |
  请基于当前的 ralplan 最终方案，生成一份中文细化实施方案：
  1. 按功能拆分为至少 3 个功能步骤，并明确关键路径、并行项和范围边界
  2. 对复杂步骤补 Mermaid 流程图；简单步骤说明可省略理由
  3. 每个步骤都明确来源依据、非目标、输入、工程动作、输出、兼容性、不变量、依赖、测试用例和风险回归点
  4. 执行动作必须落到具体模块、文件、类、组件、接口、Provider、路由或状态流，不要写空泛动作
  5. 生成完成后必须默认保存为 .omx/implementations/ 下的实施文件，文件名建议使用 <原始方案名>-detail-plan.md
  6. 如果 .omx/implementations/ 不存在，请先创建该目录再保存
  7. 如果输入 ralplan 不完整，必须显式标注哪些内容来自原方案、哪些属于合理推断、哪些仍需补充或继续核实
  8. 如果当前尚未完成 ralplan，不要直接细化，先提示应先完成 ralplan
  9. 保存完成后在输出中明确说明保存路径，并标注“已按实施文件标准保存到文件”
